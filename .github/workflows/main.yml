name: AgentFuse CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Tests & Build
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: agentfuse
          POSTGRES_PASSWORD: agentfusepassword
          POSTGRES_DB: agentfuse_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentfuse -d agentfuse_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev,langgraph]
        
    - name: Run Database Migrations
      env:
        DATABASE_URL: postgresql://agentfuse:agentfusepassword@localhost:5432/agentfuse_db
      run: |
        python -c "from agentfuse.storage.postgres import init_db; init_db()"
        
    - name: Run Tests
      env:
        DATABASE_URL: postgresql://agentfuse:agentfusepassword@localhost:5432/agentfuse_db
        REDIS_URL: redis://localhost:6379/0
      run: |
        pytest tests/
        
    - name: Run API Drift Check
      run: |
        python scripts/check_api_drift.py
        
    - name: Set up Node.js for Frontend Packaging
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Build Dashboard for Package Inclusion
      run: |
        cd frontend
        npm ci
        npm run build
        cd ..
        mkdir -p agentfuse/server/static
        cp -r frontend/dist/* agentfuse/server/static/

    - name: Test Package Build
      run: |
        python -m pip install build
        python -m build
        
    - name: Test Docker Build
      run: |
        docker build -t agentfuse:test .

  frontend-build:
    name: Frontend & Site Build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        
    - name: Build Dashboard Frontend
      run: |
        cd frontend
        npm ci
        npm run build

    - name: Build Marketing Site
      run: |
        cd site
        npm ci
        npm run build
