[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentfuse"
version = "0.1.0"
description = "The 24ms Circuit Breaker & Safety Firewall for Autonomous AI Agents"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "AgentFuse Team", email = "team@agentfuse.dev" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Monitoring",
    "Topic :: Security",
]
keywords = [
    "ai",
    "agents",
    "agentfuse",
    "circuit-breaker",
    "langgraph",
    "autogen",
    "crewai",
    "mcp",
    "model-context-protocol",
    "llm-safety",
    "observability",
    "firewall",
    "deterministic",
    "token-guard"
]
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "python-dotenv>=1.0.0",
    "sse-starlette>=1.6.0",
    "prometheus-client>=0.17.0",
    "click>=8.0.0",
    "yoyo-migrations>=8.2.0",
    "argon2-cffi>=23.1.0",
    "redis>=5.0.0",
    "httpx>=0.24.0"
]

[project.urls]
Homepage = "https://github.com/Ashitpatel001/Cortexheal"
Documentation = "https://github.com/Ashitpatel001/Cortexheal#readme"
Repository = "https://github.com/Ashitpatel001/Cortexheal.git"
Issues = "https://github.com/Ashitpatel001/Cortexheal/issues"
Changelog = "https://github.com/Ashitpatel001/Cortexheal/blob/main/CHANGELOG.md"

[project.scripts]
agentfuse = "cortexheal.cli.main:cli"
cortexheal = "cortexheal.cli.main:cli"

[project.optional-dependencies]
langgraph = ["langgraph>=0.0.10", "langchain-core>=0.1.0"]
autogen = ["pyautogen>=0.2.0"]
mcp = ["mcp>=1.0.0"]
all = [
    "langgraph>=0.0.10",
    "langchain-core>=0.1.0",
    "pyautogen>=0.2.0",
    "mcp>=1.0.0"
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-timeout>=2.0.0",
    "httpx>=0.24.0",
    "build>=1.0.0",
    "twine>=4.0.0"
]

[tool.setuptools.packages.find]
include = ["agentfuse*", "cortexheal*"]

[tool.setuptools.package-data]
agentfuse = ["py.typed"]
cortexheal = ["py.typed"]
