services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: agentfuse
      POSTGRES_PASSWORD: agentfusepassword
      POSTGRES_DB: agentfuse_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentfuse -d agentfuse_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
