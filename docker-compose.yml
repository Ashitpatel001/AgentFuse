services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: agentfuse
      POSTGRES_PASSWORD: agentfusepassword
      POSTGRES_DB: agentfuse_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentfuse -d agentfuse_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://agentfuse:agentfusepassword@postgres:5432/agentfuse_db
      REDIS_URL: redis://redis:6379/0
      PORT: 8000
      AGENTFUSE_WORKERS: 1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
