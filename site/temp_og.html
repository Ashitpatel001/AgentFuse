
  <!DOCTYPE html>
  <html>
  <head>
    <style>
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        background-color: #0B0C0E;
        color: #E7E9EE;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 80px;
        box-sizing: border-box;

      }
      .badge {
        display: inline-flex;

        gap: 8px;
        padding: 6px 14px;
        border-radius: 6px;

        border: 1px solid #2F343E;

        font-family: monospace;
        font-size: 16px;
        width: fit-content;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: #3FB68B;
      }
      h1 {
        font-size: 54px;
        font-weight: 800;
        line-height: 1.15;
        margin: 20px 0 16px 0;
        letter-spacing: -0.02em;
      }
      h1 span {
        color: #FF5A1F;
      }
      p {
        font-size: 24px;
        line-height: 1.45;
        color: #9AA1AE;
        margin: 0;
        max-width: 900px;
      }
      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-top: 1px solid #23272F;
        padding-top: 30px;
        font-family: monospace;
        font-size: 16px;
        color: #6B7280;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="badge">
        <div class="dot"></div>
        Alpha · self-hosted
      </div>
      <h1>Stop runaway agents.<br/><span>Deterministically.</span></h1>
      <p>Real-time circuit breaker for AI agents. Pauses loops and runaway spend while they happen, and a human approves the resume.</p>
    </div>
    <div class="footer">
      <span>AgentFuse Control Plane</span>
      <span>Deterministic Safety · Zero LLMs in Decision Path</span>
    </div>
  </body>
  </html>
